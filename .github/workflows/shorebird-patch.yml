name: Shorebird OTA Patch

on:
  push:
    branches:
      - 'patch/**'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms for OTA Dart patch'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      release_version:
        description: 'Optional release version (e.g. 1.0.0+1) to patch; defaults to latest release'
        required: false
        type: string

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # Fast Quality Gate before OTA Patch
  # ============================================
  verify-dart:
    name: Verify Dart Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.PRODUCTION_API_BASE_URL || secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies & generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run static analysis
        run: flutter analyze --fatal-infos

  # ============================================
  # Shorebird OTA Patch — Android (~3 min)
  # ============================================
  patch-android:
    name: Shorebird Patch (Android)
    needs: verify-dart
    if: ${{ inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.PRODUCTION_API_BASE_URL || secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies & generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Apply Shorebird OTA Patch (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            shorebird patch android --release-version="${{ inputs.release_version }}"
          else
            shorebird patch android
          fi

  # ============================================
  # Shorebird OTA Patch — iOS (~3 min)
  # ============================================
  patch-ios:
    name: Shorebird Patch (iOS)
    needs: verify-dart
    if: ${{ inputs.platforms != 'android' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.PRODUCTION_API_BASE_URL || secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies & generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ios && pod install --repo-update

      - name: Apply Shorebird OTA Patch (iOS)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            shorebird patch ios --release-version="${{ inputs.release_version }}"
          else
            shorebird patch ios
          fi

name: Flutter CI/CD

on:
  push:
    branches: [dev, prod]
    tags: ['v*.*.*']
  pull_request:
    branches: [dev, prod]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_track:
        description: 'Release track for store deployment (internal, beta, production)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - beta
          - production

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'

jobs:
  # ============================================
  # Analyze & Test Flutter App
  # ============================================
  analyze:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env file for Envied codegen
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY || 'placeholder-stream-key' }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_placeholder' }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8080' }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ============================================
  # Analyze & Test Dart Frog Backend
  # ============================================
  test-backend:
    name: Analyze & Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: flutter pub get

      - name: Generate Prisma client & schema registry
        working-directory: backend
        run: |
          dart run prisma_flutter_connector:generate \
            --schema prisma/schema.prisma \
            --output lib/generated \
            --server
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze backend code
        working-directory: backend
        run: dart analyze --fatal-infos

      - name: Run backend unit tests
        working-directory: backend
        run: dart test

  # ============================================
  # Build Android (Debug on dev/PR, Shorebird Release on prod)
  # ============================================
  build-android:
    name: Build Android
    needs: [analyze, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (Debug)
        if: github.ref != 'refs/heads/prod' && github.event_name != 'release'
        run: flutter build apk --debug

      - name: Upload Debug APK
        if: github.ref != 'refs/heads/prod' && github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: build/app/outputs/flutter-apk/*.apk

  # ============================================
  # Build iOS (No-Codesign verification on dev/PR)
  # ============================================
  build-ios:
    name: Build iOS
    needs: [analyze, test-backend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

  # ============================================
  # Release Android via Shorebird + Fastlane (prod / release)
  # ============================================
  release-android:
    name: Release Android (Shorebird + Fastlane)
    needs: [build-android]
    if: github.ref == 'refs/heads/prod' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.PRODUCTION_API_BASE_URL || secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Decode Android Keystore & Play Store Credentials
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat << EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
          echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}" > fastlane/play-store-service-account.json

      - name: Get dependencies & generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Fastlane Android Release with Shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          PLAY_STORE_SERVICE_ACCOUNT_PATH: fastlane/play-store-service-account.json
        run: fastlane android ${{ inputs.deploy_track || 'internal' }}

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ============================================
  # Release iOS via Shorebird + Fastlane Match & TestFlight (prod / release)
  # ============================================
  release-ios:
    name: Release iOS (Shorebird + Fastlane)
    needs: [build-ios]
    if: github.ref == 'refs/heads/prod' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Create .env file
        run: |
          cat << EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          API_BASE_URL=${{ secrets.PRODUCTION_API_BASE_URL || secrets.API_BASE_URL }}
          USE_PRISMA=false
          EOF

      - name: Get dependencies & generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ios && pod install --repo-update

      - name: Run Fastlane iOS Release with Match + Shorebird + TestFlight
        env:
          CI: 'true'
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ "${{ inputs.deploy_track }}" = "production" ]; then
            fastlane ios release
          else
            fastlane ios beta
          fi

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa

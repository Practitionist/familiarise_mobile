name: familiarise_mobile
description: "Familiarise Mobile - Connect with Expert Consultants"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  sentry_flutter: ^9.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.9.2
  connectivity_plus: ^7.0.0

  # Database (Supabase - Fallback)
  supabase_flutter: ^2.6.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Stream SDK - Video & Chat (Phase 7-8)
  stream_video_flutter: ^1.3.0
  stream_chat_flutter: ^9.23.0

  # Payments
  razorpay_flutter: ^1.4.1
  flutter_stripe: ^11.0.0

  # Storage
  flutter_secure_storage: ^9.2.2
  # hive_flutter: ^1.1.0  # Commented: will enable with compatible version later
  shared_preferences: ^2.3.2

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.2
  flutter_animate: ^4.5.0

  # Functional Programming
  fpdart: ^1.1.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  share_plus: ^11.0.0
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  device_info_plus: ^12.1.0

  # Environment
  envied: ^1.1.0

  # Firebase (Analytics, Push)
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3

  # Local Notifications
  flutter_local_notifications: ^17.2.3
  flutter_web_auth_2: ^4.1.0
  http: ^1.6.0

dev_dependencies:
  sentry_dart_plugin: ^3.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  envied_generator: ^1.1.0
  # hive_generator: ^2.0.1  # Commented: conflicts with freezed source_gen

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: familiarise_mobile
  org: practitionist
